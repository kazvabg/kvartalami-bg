name: Aggregate News
on:
  schedule:
    # 06:00, 12:00, 18:00 Sofia time (UTC+2 winter / UTC+3 summer)
    # Using UTC+2 (EET): 04:00, 10:00, 16:00 UTC
    - cron: '0 4,10,16 * * *'
  workflow_dispatch: {}  # Manual trigger button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Scrape sources
        run: node scripts/scrape.js
        timeout-minutes: 3

      - name: Summarize articles
        run: node scripts/summarize.js
        timeout-minutes: 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build static site
        run: node scripts/build.js

      - name: Commit and push if changed
        run: |
          git config user.name "kvartalami-bot"
          git config user.email "bot@kvartalami.bg"
          git add data/ site/
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "Update $(date -u +%Y-%m-%dT%H:%M)"
          # Retry push up to 3× — GitHub's git backend intermittently rejects with
          # "remote: fatal error in commit_refs" (transient infrastructure issue).
          for attempt in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "push attempt $attempt failed, retrying in 30s..."
              sleep 30
              git pull --rebase origin main || true
            else
              echo "push failed after 3 attempts"
              exit 1
            fi
          done

      - name: Deploy to Cloudflare Pages
        if: success()
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=kvartalami --branch=main --commit-message=auto-deploy
